# Aegis-V2X — AI model configuration
# Values sourced from: 03_Mathematical_Formulation, 04_Novel_Algorithm_Design
# Populated (activated) during Phase 4-5. Present now so config schema is
# frozen before implementation begins.

trust_estimator:
  # z_t = [w1*e_t, w2*u_t, w3*a_t, w4*q_t]  (prediction error, uncertainty,
  # sync age, comm quality)
  feature_weights:
    prediction_error: 0.35      # w1
    prediction_uncertainty: 0.25 # w2
    sync_age: 0.20               # w3
    comm_quality: 0.20           # w4
  calibration_temperature: 0.8   # tau in T_t = sigmoid(S_t / tau)
  calibration_bins:              # for reliability-diagram / ECE evaluation
    - [0.0, 0.2]   # very unreliable
    - [0.2, 0.4]   # low confidence
    - [0.4, 0.6]   # moderate confidence
    - [0.6, 0.8]   # reliable
    - [0.8, 1.0]   # highly reliable
  # Platt calibration T_cal = sigmoid(a * raw_score + b) on top of the unchanged
  # estimator (ai/trust_estimator/calibration.py); uncalibrated = (1/tau, 0).
  # FITTED ON THE LIVE-DRIVE BROWSER SIMULATION (Logapriya05/aegis-v2x-live-drive,
  # research/pipeline/calibrate_trust.py), NOT on CARLA or real vehicles.
  # Target: twin object within 1.0 m of the LiDAR-observed position on the next cycle.
  # 8000 training / 3992 held-out cycles; held-out ECE 0.1288 -> 0.0419.
  platt_calibration:
    a: 4.398645468120582
    b: 1.1421320450667993
    fitted_on: "live-drive simulation, 8 conditions, 3GPP TR 37.885 channel, GRU twin predictor, estimate-based twin correctness, 2026-11-06"

criticality_estimator:
  # C_t = sum(alpha_i * f_i), sum(alpha_i) = 1
  feature_weights:
    relative_speed: 0.25
    blockage_probability: 0.25
    sync_age: 0.15
    channel_degradation: 0.20
    traffic_density: 0.15

tahs:
  # H_t = H_min + (H_max - H_min) * sigmoid(beta*T_t - gamma*C_t + delta*A_t)
  horizon_min: 1
  horizon_max: 10
  horizon_discretization: [1, 2, 3, 5, 8, 10]
  beta: 1.0   # trust sensitivity
  gamma: 1.0  # criticality sensitivity
  delta: 1.0  # GDCA authority sensitivity -- PROVISIONAL/UNCALIBRATED architectural default (Phase 5 three-input extension), not optimized or empirically validated
  # Profile used by the live-drive demo. beta = gamma = delta = 1 above can only
  # reach horizons 3..8 (sigmoid argument stays in [-1, 2]); these values reach the
  # full 1..10 range and keep the neutral point (T, C, A) = (0.5, 0.5, 0.5) at H = 5.
  # Same formula, only the coefficients differ. Design choice, not optimized.
  profiles:
    full_range:
      beta: 3.0
      gamma: 5.0
      delta: 2.0

fsdp:
  trust_bins: ["low", "medium", "high"]
  criticality_bins: ["low", "medium", "high"]
  num_states: 9   # 3 x 3
  # TableFSDP bins: value < edges[0] -> low, < edges[1] -> medium, else high
  trust_bin_edges: [0.4, 0.6]          # match the calibration bands above
  criticality_bin_edges: [0.3333333333333333, 0.6666666666666666]
  actions:
    - synchronize
    - predict
    - beam_switch
    - reduce_horizon
    - increase_horizon
    - maintain_state
  policy_table_path: "models/fsdp_policy_table.json"  # generated offline, Phase 5

perception:
  pointpillars:
    # Empirically derived from the real Aegis-V2X Phase 2 LiDAR dataset
    # (straight_road_dense_clear_day_Scene00 + roundabout_sparse_night_Scene00,
    # ~62M real points, percentile-based p0.1-p99.9 envelope; 99.421% real-point
    # retention). This is NOT the original KITTI/PointPillars reference range,
    # and it is NOT confirmed against any Aegis-V2X mathematical specification
    # (03_Mathematical_Formulation/04_Novel_Algorithm_Design are unrecoverable
    # -- see Phase 4 LiDAR coordinate investigation). No semantic axis meaning
    # (forward/right/up, ego frame, vehicle frame) is asserted for x/y/z --
    # these bounds describe the empirically observed Aegis LiDAR frame only,
    # exactly as recorded, with no rotation/translation/sign-flip applied.
    # Valid for isolated PointPillars feature extraction only; NOT yet
    # approved for V2X-ViT cooperative fusion or Digital Twin/world alignment.
    voxel_size: [0.16, 0.16, 19.68]
    point_cloud_range: [-115.07, -57.43, -3.39, -0.04, 0.00, 16.29]
  v2x_vit:
    embed_dim: 256
    num_heads: 8
    num_layers: 4
  gru:
    hidden_size: 128
    num_layers: 2
    input_features: ["csi", "snr", "beam_index", "mobility"]
  # Twin motion predictor profile (ai/gru/train_twin_predictor.py): the same GRUPredictor
  # architecture, small enough for 10 Hz prediction of every road user in the live demo.
  gru_twin:
    hidden_size: 32
    num_layers: 1
    input_features: ["forward_offset", "lateral_offset", "speed", "sin_heading_change", "age"]

objective_function:
  # J = w1*L + w2*E + w3*O + w4*F - w5*R
  weights:
    latency: 0.25
    energy: 0.20
    sync_overhead: 0.20
    beam_failures: 0.20
    reliability: 0.15
  # Constraint for generating the FSDP table (chosen 2026-11-04): minimise J only among
  # policies whose twin correctness (the R term) is at least the fixed baseline's
  # (horizon 5, edge synchronisation every 1 s) in closed-loop evaluation. Without it,
  # minimising J alone chose to synchronise far less and let twin correctness fall from
  # 57% to 46% (live-drive simulation), i.e. it traded accuracy for resources.
  constraints:
    twin_correctness_at_least_fixed_baseline: true
    fixed_baseline:
      horizon: 5
      sync_period_s: 1.0

twintrust_ap:
  # Evidence normalisation (ai/twintrust_ap/evidence.py): raw value / reference, clipped
  # to [0, 1]. Values used by the live-drive demo; design choices, not fitted.
  evidence:
    error_ref_m: 3.0
    age_ref_s: 1.0
    latency_ref_ms: 300.0
    relative_speed_ref_mps: 20.0
    density_ref: 20.0
    correct_within_m: 1.0
  # mmWave V2V channel and beam model used by the live-drive demo (2026-11-06). Pathloss,
  # vehicle blockage and shadowing follow 3GPP TR 37.885 (V2V urban); the beam gain follows the
  # 3GPP TR 38.901 element pattern A(theta) = -min(12 (theta/theta3dB)^2, 30 dB) with theta3dB =
  # beamwidth_deg and theta = drift of the bearing since the last beam sweep. Link state comes from
  # the simulated geometry: NLOS (building), NLOSv (vehicle within blocker_radius_m of the line of
  # sight), else LOS. The link budget values are design choices, not measured. A link counts as
  # degraded in the criticality blockage feature when it is NLOS or NLOSv, or misaligned by more
  # than half the beamwidth. A beam_switch action re-sweeps all links (outage sweep_s) and, for 2 s,
  # replaces NLOS links by a reflected path (LOS pathloss + relay_extra_loss_db). The fixed
  # baseline sweeps every 1 s together with its sync.
  # TwinTrust-AP only (ai/twintrust_ap/twin_adaptation.py; demo research/README.md section 10):
  # age_bridging keeps prediction on and raises the horizon to cover the mean information age;
  # beam_tracking steers tracked beams to the twin's predicted vehicle positions between sweeps.
  adaptation:
    age_bridging: true
    beam_tracking: true
  beam:
    beamwidth_deg: 12.0
    sweep_s: 0.02
  channel:
    carrier_ghz: 30.0
    tx_power_dbm: 23.0
    antenna_gain_dbi: 10.0
    bandwidth_mhz: 400.0
    noise_figure_db: 9.0
    snr50_db: 3.0
    per_slope_db: 0.8
    relay_extra_loss_db: 10.0
    shadow_decorrelation_m: 10.0
    blocker_radius_m: 1.2
